name: iOS

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/sync/**"
      - "packages/core/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "packages/sync/**"
      - "packages/core/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.vouch.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - id: vouch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.gate({ github, context, core });

  app:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo built

  packages:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo tested

  never:
    needs: gate
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo never
